name: reading
description: AI伴读应用 - 沉浸式深度阅读伴侣
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # UI组件
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  # 状态管理
  provider: ^6.1.1
  # 路由
  go_router: ^13.0.0
  # 图片选择和相机
  image_picker: ^1.0.7
  # 文件选择
  file_picker: ^8.1.4
  # 文本处理
  flutter_highlight: ^0.7.0
  # 动画
  flutter_animate: ^4.5.0
  # 图表（用于关系图谱）
  fl_chart: ^0.66.0
  # 本地存储
  shared_preferences: ^2.2.2
  # HTTP请求（用于未来API调用）
  http: ^1.2.0
  # 音频播放
  audioplayers: ^5.2.1
  # 文本转语音（未来集成）
  flutter_tts: ^4.0.2
  # PDF 阅读
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.2
  syncfusion_flutter_pdf: ^25.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/PDF/

